[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "churnguard"
version = "1.0.0"
description = "End-to-end MLOps system for customer churn prediction: data contracts, Optuna + MLflow, quality-gated model registry, FastAPI serving, drift monitoring and continuous training."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "John Byron Alzate Hernández" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.6",
    "lightgbm>=4.3",
    "optuna>=4.0",
    "mlflow>=2.16",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "prometheus-client>=0.20",
    "pyyaml>=6.0",
    "joblib>=1.4",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
churnguard = "churnguard.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
