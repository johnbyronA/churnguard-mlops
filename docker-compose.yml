# Local production-like stack (MLflow UI runs separately: `make mlflow`):
#   api        -> http://localhost:8000/docs   (prediction service)
#   prometheus -> http://localhost:9090        (live API metrics)
#   grafana    -> http://localhost:3000        (dashboard, admin/admin)
services:
  api:
    build: .
    image: churnguard-api:latest
    ports: ["8000:8000"]
    volumes:
      - ./logs:/app/logs
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me}
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    depends_on: [api]

  grafana:
    image: grafana/grafana:12.0.0
    ports: ["3000:3000"]
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
